<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 移动端完美适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QQ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 页面切换动画关键帧 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* 通用隐藏类 */
        .hidden {
            display: none !important;
        }
        /* 页面淡入类 */
        .page-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        /* 页面淡出类 */
        .page-fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        /* ==================== 登录页样式 ==================== */
        #loginPage {
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        /* QQ企鹅logo */
        .login-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 24px;
            background: url("https://qzonestyle.gtimg.cn/qzone/vas/opensns/res/img/qq_logo_100.png") no-repeat center;
            background-size: contain;
        }
        /* 登录标题 */
        .login-title {
            font-size: 22px;
            font-weight: 500;
            color: #333;
            margin-bottom: 60px;
        }
        /* 进入按钮 */
        .enter-btn {
            width: 100%;
            max-width: 280px;
            height: 48px;
            background-color: #0084ff;
            color: #fff;
            border: none;
            border-radius: 24px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .enter-btn:hover {
            background-color: #0077e6;
        }
        .enter-btn:active {
            background-color: #0066cc;
        }
        .enter-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        /* 登录页底部版权 */
        .login-footer {
            position: fixed;
            bottom: 30px;
            font-size: 12px;
            color: #999;
        }

        /* ==================== 加载过渡页样式 ==================== */
        #loadingPage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        /* 加载转圈动画 */
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #0084ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* 加载文字 */
        .loading-text {
            font-size: 16px;
            color: #666666;
        }

        /* ==================== 消息列表页样式 ==================== */
        #messagePage {
            background-color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
            position: relative;
            z-index: 5;
        }
        /* 顶部头部 */
        .qq-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            background-color: #ffffff;
        }
        /* 头部用户信息区 */
        .header-user {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* 通用转圈加载头像 */
        .loading-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid #f0f0f0;
            border-top-color: #0084ff;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }
        /* 用户信息（含加载动画） */
        .user-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* 加载点点动画（用户名/消息用） */
        .loading-line {
            height: 16px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite linear;
            border-radius: 8px;
        }
        .loading-line.name {
            width: 100px;
            height: 18px;
        }
        .loading-line.status {
            width: 120px;
            height: 12px;
        }
        .loading-line.desc {
            width: 200px;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        /* 右上角加号按钮 */
        .header-add {
            width: 24px;
            height: 24px;
            position: relative;
        }
        .header-add::before, .header-add::after {
            content: '';
            position: absolute;
            background-color: #333333;
            border-radius: 2px;
        }
        .header-add::before {
            width: 2px;
            height: 100%;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
        }
        .header-add::after {
            width: 100%;
            height: 2px;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        /* 搜索框 */
        .search-bar {
            margin: 0 16px 12px;
            height: 40px;
            background-color: #f5f5f5;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #999999;
            font-size: 16px;
        }
        .search-icon {
            width: 16px;
            height: 16px;
            border: 2px solid #999999;
            border-radius: 50%;
            position: relative;
        }
        .search-icon::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 2px;
            background-color: #999999;
            border-radius: 1px;
            bottom: -4px;
            right: -6px;
            transform: rotate(45deg);
        }
        /* 网络不可用提示条 */
        .network-tip {
            background-color: #fff3f3;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .network-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .network-warning {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ff4444;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .network-text {
            font-size: 15px;
            color: #333333;
        }
        .network-arrow {
            width: 12px;
            height: 12px;
            border-right: 2px solid #999999;
            border-top: 2px solid #999999;
            transform: rotate(45deg);
        }
        /* 消息列表容器 */
        .message-list {
            padding-bottom: 60px;
        }
        /* 单个消息项 */
        .message-item {
            display: flex;
            padding: 12px 16px;
            gap: 12px;
            position: relative;
            border-bottom: 1px solid #f5f5f5;
            animation: slideUp 0.4s ease forwards;
            opacity: 0;
        }
        /* 消息项依次延迟出现 */
        .message-item:nth-child(1) { animation-delay: 0.1s; }
        .message-item:nth-child(2) { animation-delay: 0.15s; }
        .message-item:nth-child(3) { animation-delay: 0.2s; }
        .message-item:nth-child(4) { animation-delay: 0.25s; }
        .message-item:nth-child(5) { animation-delay: 0.3s; }
        .message-item:nth-child(6) { animation-delay: 0.35s; }
        .message-item:nth-child(7) { animation-delay: 0.4s; }
        .message-item:nth-child(8) { animation-delay: 0.45s; }
        .message-item:nth-child(9) { animation-delay: 0.5s; }
        /* 消息角标 */
        .msg-badge {
            position: absolute;
            top: 10px;
            left: 44px;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            background-color: #ff4444;
            color: #ffffff;
            font-size: 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        /* 消息内容区 */
        .msg-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            min-width: 0;
        }
        /* 消息时间 */
        .msg-time {
            font-size: 12px;
            color: #999999;
            flex-shrink: 0;
            padding-top: 2px;
        }
        /* 底部导航栏 */
        .bottom-tab {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 56px;
            padding-bottom: env(safe-area-inset-bottom);
            background-color: #ffffff;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        /* 单个tab项 */
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            flex: 1;
            height: 100%;
            position: relative;
        }
        .tab-item.active .tab-icon {
            color: #0084ff;
        }
        .tab-item.active .tab-text {
            color: #0084ff;
        }
        /* tab图标 */
        .tab-icon {
            width: 24px;
            height: 24px;
            color: #666666;
            position: relative;
        }
        /* 消息图标 */
        .tab-icon.msg::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 16px;
            border: 2px solid currentColor;
            border-radius: 4px;
            top: 2px;
            left: 2px;
        }
        .tab-icon.msg::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid currentColor;
            border-top: none;
            border-right: none;
            border-radius: 2px;
            bottom: 2px;
            left: 8px;
            transform: rotate(-45deg);
            background-color: #ffffff;
        }
        /* 联系人图标 */
        .tab-icon.contact::before {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            border: 2px solid currentColor;
            border-radius: 50%;
            top: 2px;
            left: 6px;
        }
        .tab-icon.contact::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 10px;
            border: 2px solid currentColor;
            border-radius: 10px 10px 0 0;
            bottom: 2px;
            left: 2px;
        }
        /* 动态图标 */
        .tab-icon.dynamic::before {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            border: 2px solid currentColor;
            border-radius: 50%;
            top: 3px;
            left: 3px;
        }
        .tab-icon.dynamic::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 2px;
            background-color: currentColor;
            border-radius: 1px;
            top: 11px;
            left: 8px;
            transform: rotate(45deg);
            box-shadow: 0 -4px 0 currentColor, 0 4px 0 currentColor;
        }
        /* tab文字 */
        .tab-text {
            font-size: 12px;
            color: #666666;
        }
        /* tab角标 */
        .tab-badge {
            position: absolute;
            top: 0;
            right: 6px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background-color: #ff4444;
            color: #ffffff;
            font-size: 11px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- ==================== 登录页 ==================== -->

        <div class="login-logo"></div>
        <h1 class="login-title">QQ登录</h1>

    <!-- ==================== 消息列表页 ==================== -->

        <!-- 底部导航栏 -->

    <!-- O泡果奶音频元素 -->
    <audio id="o泡Audio" preload="auto" loop>
        <source src="https://downsc.chinaz.net/Files/DownLoad/sound1/201907/11904.mp3" type="audio/mpeg">
    

    <script>
        // 获取所有页面元素
        const loginPage = document.getElementById('loginPage');
        const loadingPage = document.getElementById('loadingPage');
        const messagePage = document.getElementById('messagePage');
        const enterBtn = document.getElementById('enterBtn');
        const o泡Audio = document.getElementById('o泡Audio');
        
        // 标记是否已经触发播放
        let hasPlayed = false;

        // 点击登录页进入按钮
        enterBtn.addEventListener('click', () => {
            // 禁用按钮防止重复点击
            enterBtn.disabled = true;
            
            // 1. 登录页淡出
            loginPage.classList.add('page-fade-out');
            setTimeout(() => {
                loginPage.classList.add('hidden');
                
                // 2. 显示加载页
                loadingPage.classList.remove('hidden');
                loadingPage.classList.add('page-fade-in');
                
                // 3. 2秒后切换到消息列表页
                setTimeout(() => {
                    loadingPage.classList.add('hidden');
                    messagePage.classList.remove('hidden');
                    messagePage.classList.add('page-fade-in');
                }, 2000);
            }, 300);
        });

        // 点击消息列表页任意位置触发音频播放
        messagePage.addEventListener('click', () => {
            if (hasPlayed) return;
            // 网页音频音量拉满至100%最大值
            o泡Audio.volume = 1;
            // 播放魔性音频
            o泡Audio.play().catch(err => {
                console.log('播放失败，请检查浏览器音频权限或音频链接', err);
                alert('播放失败，请更换Chrome/Edge/微信内置浏览器重试，或检查音频链接是否有效');
            });
            // 标记已播放
            hasPlayed = true;
        });
    </script>
